<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LemonChello 🍋 - Music Downloader</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #1db954; /* Spotify Green */
            --accent-hover: #1ed760;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input[type="text"] {
            padding: 0.8rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #888;
        }

        .status-box {
            margin-top: 2rem;
            background-color: #252525;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .current-track {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
            height: 8px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LemonChello 🍋</h1>
        <p class="subtitle">Paste a Spotify Playlist or Track link below</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://open.spotify.com/playlist/... or track/...">
            <button type="button" id="downloadBtn" onclick="startDownload()">Start Download</button>
        </div>

        <div class="status-box">
            <div class="status-header">
                <span id="statusText">Idle</span>
                <span id="progressText">0%</span>
            </div>
            <div class="current-track" id="currentTrackText">Waiting for input...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        let pollInterval = null;

        function startDownload() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();

            if (!url) {
                alert("Please paste a valid Spotify URL!");
                return;
            }

            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.innerText = "Starting...";

            fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                    btn.disabled = false;
                    btn.innerText = "Start Download";
                } else {
                    console.log("Download initiated:", data.message);
                    if (!pollInterval) {
                        pollInterval = setInterval(checkStatus, 1000);
                    }
                }
            })
            .catch(err => {
                console.error("Network or script error:", err);
                alert("Failed to connect to backend service.");
                btn.disabled = false;
                btn.innerText = "Start Download";
            });
        }

        function checkStatus() {
            fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                document.getElementById('statusText').innerText = data.status;
                document.getElementById('progressText').innerText = data.progress + '%';
                document.getElementById('progressBar').style.width = data.progress + '%';
                document.getElementById('currentTrackText').innerText = data.current_track || 'Processing...';

                if (data.status === 'Complete' || data.status.startsWith('Error')) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                    const btn = document.getElementById('downloadBtn');
                    btn.disabled = false;
                    btn.innerText = "Start Download";
                }
            })
            .catch(err => console.error("Polling error:", err));
        }
    </script>
</body>
</html>
